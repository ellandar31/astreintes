services:
  astreintes:
    build: .
    container_name: astreintes-app
    environment:
      SUPABASE_INTERNAL_URL: ${SUPABASE_INTERNAL_URL:-http://host.docker.internal:8000}
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8180:8080"
    restart: unless-stopped
