<section class="regular-view" aria-labelledby="regular-title">
  <header class="regular-toolbar">
    <div>
      <p class="eyebrow">{{ labels.regular.eyebrow }}</p>
      <h2 id="regular-title">{{ labels.regular.title }}</h2>
    </div>

    <div class="regular-actions">
      <label for="regular-team">
        {{ labels.regular.fields.team }}
        <p-select
          inputId="regular-team"
          [options]="teams"
          [(ngModel)]="selectedTeamId"
          name="regularTeam"
          optionLabel="name"
          optionValue="id"
          appendTo="body"
          styleClass="team-select"
        ></p-select>
      </label>

      @if (canCreateOperations()) {
        <p-button
          icon="pi pi-calendar-plus"
          [disabled]="!selectedTeamId"
          [label]="labels.regular.actions.addOnCallPeriod"
          (onClick)="openPeriodModal()"
        ></p-button>
      }
      <p-button
        icon="pi pi-clock"
        severity="secondary"
        [outlined]="true"
        [label]="labels.regular.actions.addIntervention"
        (onClick)="openInterventionModal()"
      ></p-button>
    </div>
  </header>

  <app-calendar
    [(month)]="currentMonth"
    [entries]="calendarEntries()"
    [holidays]="publicHolidays"
    (entryActivated)="openCalendarEntry($event)"
  />
</section>

@if (isPeriodModalOpen && (editingPeriodId || canCreateOperations())) {
  <app-regular-period-modal
    [form]="periodForm"
    [directions]="directions()"
    [interventions]="editingPeriodInterventions"
    [isEditing]="!!editingPeriodId"
    [isLocked]="isPeriodArchived(editingPeriod)"
    [planningReadOnly]="!canEditPlanning()"
    [canManageIntervention]="canManageIntervention"
    [canAddIntervention]="!!editingPeriod && canManageIntervention(editingPeriod)"
    [sentToRhAt]="editingPeriod?.sentToRhAt"
    [users]="selectedTeamUsers"
    (closed)="closePeriodModal()"
    (deleted)="deletePeriod()"
    (interventionAdded)="openInterventionForCurrentPeriod()"
    (interventionDeleted)="deleteIntervention($event)"
    (interventionEdited)="openEditInterventionModal($event)"
    (saved)="savePeriod($event)"
  ></app-regular-period-modal>
}

@if (isInterventionModalOpen) {
  <app-regular-intervention-modal
    [error]="interventionError"
    [form]="interventionForm"
    [isEditing]="!!editingInterventionId"
    [users]="interventionUsers"
    (closed)="closeInterventionModal()"
    (saved)="saveIntervention($event)"
  ></app-regular-intervention-modal>
}
