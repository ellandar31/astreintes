<section class="settings-section">
  <div class="settings-section-header">
    <div>
      <p class="eyebrow">{{ labels.settings.rhCompensation.eyebrow }}</p>
      <h3>{{ labels.settings.rhCompensation.title }}</h3>
    </div>
  </div>

  <form class="compensation-form" (ngSubmit)="saveCompensationRules()">
    <p-card styleClass="compensation-block">
      <ng-template pTemplate="header">
        <h4>{{ labels.settings.rhCompensation.onCall }}</h4>
      </ng-template>

      <p-table [value]="(onCallRows) | tableRows" styleClass="settings-table editable-table" [tableStyle]="{ 'min-width': '30rem' }">
        <ng-template pTemplate="header">
          <tr>
            <th scope="col" pSortableColumn="label"><app-table-column-header field="label" [label]="labels.settings.rhCompensation.type" kind="text" /></th>
            <th scope="col" pSortableColumn="coefficient"><app-table-column-header field="coefficient" [label]="labels.settings.rhCompensation.coefficientOnCall" kind="numeric" /></th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-row>
          <tr>
            <td><strong>{{ row.label }}</strong></td>
            <td>
              <label class="sr-only" [for]="'onCall-' + row.id">{{ labels.settings.rhCompensation.coefficientOnCall }} {{ row.label }}</label>
              <p-inputNumber
                [inputId]="'onCall-' + row.id"
                [min]="0"
                [minFractionDigits]="0"
                [maxFractionDigits]="2"
                [step]="0.01"
                name="onCall-{{ row.id }}"
                [(ngModel)]="row.coefficient"
              ></p-inputNumber>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </p-card>

    <p-card styleClass="compensation-block">
      <ng-template pTemplate="header">
        <h4>{{ labels.settings.rhCompensation.interventionWorkRest }}</h4>
      </ng-template>

      <p-table [value]="(periodRows) | tableRows" styleClass="settings-table editable-table" [tableStyle]="{ 'min-width': '56rem' }">
        <ng-template pTemplate="header">
          <tr>
            <th scope="col" pSortableColumn="label"><app-table-column-header field="label" [label]="labels.settings.rhCompensation.range" kind="text" /></th>
            <th scope="col" pSortableColumn="interventionCoefficient"><app-table-column-header field="interventionCoefficient" [label]="labels.settings.rhCompensation.coefficientIntervention" kind="numeric" /></th>
            <th scope="col" pSortableColumn="workCoefficient"><app-table-column-header field="workCoefficient" [label]="labels.settings.rhCompensation.coefficientWork" kind="numeric" /></th>
            <th scope="col" pSortableColumn="restCoefficient"><app-table-column-header field="restCoefficient" [label]="labels.settings.rhCompensation.coefficientRest" kind="numeric" /></th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-row>
          <tr>
            <td><strong>{{ row.label }}</strong></td>
            <td>
              <label class="sr-only" [for]="'intervention-' + row.id">{{ labels.settings.rhCompensation.coefficientIntervention }} {{ row.label }}</label>
              <p-inputNumber
                [inputId]="'intervention-' + row.id"
                [min]="0"
                [minFractionDigits]="0"
                [maxFractionDigits]="2"
                [step]="0.01"
                name="intervention-{{ row.id }}"
                [(ngModel)]="row.interventionCoefficient"
              ></p-inputNumber>
            </td>
            <td>
              <label class="sr-only" [for]="'work-' + row.id">{{ labels.settings.rhCompensation.coefficientWork }} {{ row.label }}</label>
              <p-inputNumber
                [inputId]="'work-' + row.id"
                [min]="0"
                [minFractionDigits]="0"
                [maxFractionDigits]="2"
                [step]="0.01"
                name="work-{{ row.id }}"
                [(ngModel)]="row.workCoefficient"
              ></p-inputNumber>
            </td>
            <td>
              <label class="sr-only" [for]="'rest-' + row.id">{{ labels.settings.rhCompensation.coefficientRest }} {{ row.label }}</label>
              <p-inputNumber
                [inputId]="'rest-' + row.id"
                [min]="0"
                [minFractionDigits]="0"
                [maxFractionDigits]="2"
                [step]="0.01"
                name="rest-{{ row.id }}"
                [(ngModel)]="row.restCoefficient"
              ></p-inputNumber>
            </td>
          </tr>
        </ng-template>
      </p-table>

      <p class="muted">{{ labels.settings.rhCompensation.autoRound }}</p>
    </p-card>

    <div class="form-actions">
      <p-button icon="pi pi-save" type="submit" [label]="labels.settings.rhCompensation.save"></p-button>
    </div>
  </form>
</section>
