server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /app-config.js {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location = /supabase {
    return 308 /supabase/;
  }

  # Single-origin gateway for Supabase.
  #
  # Browsers opened through Tailscale Funnel use HTTPS. Routing Supabase through
  # the same Nginx origin prevents mixed-content and CORS failures while keeping
  # the Supabase containers off the public Funnel endpoint.
  location ^~ /supabase/ {
    rewrite ^/supabase/(.*)$ /$1 break;

    proxy_pass ${SUPABASE_INTERNAL_URL};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
